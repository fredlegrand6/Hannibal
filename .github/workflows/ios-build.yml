# Checks that the native iPhone app (ios/) still compiles. Runs on pull
# requests that touch ios/ or the orb (macOS minutes are costly). Builds for the simulator, so no signing is needed;
# installing on Fred's iPhone is still done from Xcode on his Mac.
name: iOS app builds
on:
  pull_request:
    paths: ['ios/**', 'server/phone/orb.js', '.github/workflows/ios-build.yml']
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Orb copy matches the web app's orb
        run: cmp server/phone/orb.js ios/Hannibal/orb.js || { echo "Copy server/phone/orb.js to ios/Hannibal/orb.js"; exit 1; }
      - name: Show Xcode
        run: xcodebuild -version
      - name: Build for the simulator
        run: |
          xcodebuild -project ios/Hannibal.xcodeproj -target Hannibal -configuration Debug \
            -sdk iphonesimulator CODE_SIGNING_ALLOWED=NO build | tail -60
          test ${PIPESTATUS[0]} -eq 0
      - name: Orb is inside the app
        run: test -f ios/build/Debug-iphonesimulator/Hannibal.app/orb.js
