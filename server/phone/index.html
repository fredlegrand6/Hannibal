<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#05070c">
<link rel="manifest" href="/manifest.json">
<link rel="icon" href="/icon.svg">
<link rel="apple-touch-icon" href="/icon.svg">
<title>Hannibal</title>
<style>
  :root { --bg:#05070c; --panel:#0c1220; --line:#1b2638; --text:#e8eef8; --dim:#8394ad; --accent:#35d0ff; --me:#173049; --ok:#2fd47a; --no:#ff5d6c; --gold:#d4a24c; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--text); font:16px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  body { display:flex; flex-direction:column; height:100dvh; padding-top:env(safe-area-inset-top); background:radial-gradient(ellipse at 50% 22%, #0a1830 0%, var(--bg) 60%) var(--bg); }
  header { display:flex; align-items:center; gap:10px; padding:10px 16px; }
  header .dot { width:10px; height:10px; border-radius:50%; background:var(--dim); box-shadow:0 0 0 0 transparent; }
  header .dot.on { background:var(--accent); box-shadow:0 0 12px var(--accent); }
  header h1 { font-size:15px; letter-spacing:.32em; margin:0; font-weight:600; }
  /* The living orb: shrinks when the keyboard is up, conversation below. */
  .stage { position:relative; flex:none; height:clamp(110px, 36dvh, 340px); }
  #orb { display:block; width:100%; height:100%; }
  .phase { position:absolute; left:0; right:0; bottom:4px; text-align:center; font-size:11px; letter-spacing:.34em; text-transform:uppercase; color:var(--accent); text-shadow:0 0 10px rgba(53,208,255,.6); pointer-events:none; transition:color .4s; }
  .phase.gold { color:var(--gold); text-shadow:0 0 10px rgba(212,162,76,.6); }
  header .state { margin-left:auto; font-size:12px; color:var(--dim); }
  header button { background:none; border:1px solid var(--line); color:var(--dim); border-radius:8px; padding:4px 8px; font-size:12px; }
  #log { flex:1; overflow-y:auto; padding:12px 16px; display:flex; flex-direction:column; gap:10px; -webkit-mask-image:linear-gradient(to bottom, transparent 0, #000 24px); mask-image:linear-gradient(to bottom, transparent 0, #000 24px); }
  .msg { max-width:86%; padding:10px 13px; border-radius:16px; white-space:pre-wrap; word-wrap:break-word; }
  .me { align-self:flex-end; background:var(--me); border-bottom-right-radius:4px; }
  .him { align-self:flex-start; background:rgba(12,18,32,.8); border:1px solid rgba(53,208,255,.18); border-bottom-left-radius:4px; }
  .note { align-self:center; color:var(--dim); font-size:13px; text-align:center; }
  .notify { align-self:stretch; background:#0e1a2a; border:1px solid #1f3b57; }
  .confirm { align-self:stretch; background:#1a1508; border:1px solid #5a4614; }
  .confirm .row { display:flex; gap:10px; margin-top:10px; }
  .confirm button { flex:1; padding:10px; border-radius:10px; border:0; font-weight:700; font-size:16px; }
  .yes { background:var(--ok); color:#04130a; } .no { background:#2a2f3a; color:var(--text); }
  .thinking { color:var(--dim); font-style:italic; }
  footer { display:flex; gap:8px; align-items:flex-end; padding:10px 12px calc(10px + env(safe-area-inset-bottom)); background:transparent; }
  textarea { flex:1; resize:none; max-height:120px; min-height:44px; padding:11px 14px; border-radius:22px; border:1px solid var(--line); background:var(--panel); color:var(--text); font:inherit; outline:none; }
  #send { width:44px; height:44px; border-radius:50%; border:0; background:var(--accent); color:#03131c; font-size:20px; font-weight:700; }
  #mic { width:64px; height:64px; border-radius:50%; border:2px solid var(--accent); background:transparent; color:var(--accent); flex:none; touch-action:none; user-select:none; -webkit-user-select:none; }
  #mic svg { width:28px; height:28px; }
  #mic.rec { background:var(--no); border-color:var(--no); color:#fff; transform:scale(1.08); }
  .hint { position:fixed; left:0; right:0; bottom:calc(92px + env(safe-area-inset-bottom)); text-align:center; color:var(--dim); font-size:13px; pointer-events:none; }
</style>
</head>
<body>
<header>
  <span class="dot" id="dot"></span><h1>HANNIBAL</h1>
  <span class="state" id="state">connecting…</span>
  <button id="voiceBtn" title="Read every answer aloud">🔈</button>
</header>
<div class="stage"><canvas id="orb" aria-hidden="true"></canvas><div class="phase" id="phase">Ready</div></div>
<div id="log"></div>
<div class="hint" id="hint"></div>
<footer>
  <textarea id="text" rows="1" placeholder="Message Hannibal"></textarea>
  <button id="send" aria-label="Send" hidden>↑</button>
  <button id="mic" aria-label="Hold to talk"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 15a3 3 0 0 0 3-3V6a3 3 0 1 0-6 0v6a3 3 0 0 0 3 3zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.92V21h2v-2.08A7 7 0 0 0 19 12h-2z"/></svg></button>
</footer>
<script src="/orb.js"></script>
<script>
'use strict';
const $ = (id) => document.getElementById(id);
const log = $('log'), text = $('text'), send = $('send'), mic = $('mic'), hint = $('hint');
let voiceAlways = localStorage.getItem('voiceAlways') === '1';
const setVoiceBtn = () => { $('voiceBtn').textContent = voiceAlways ? '🔊' : '🔈'; };
setVoiceBtn();
$('voiceBtn').onclick = () => { voiceAlways = !voiceAlways; try { localStorage.setItem('voiceAlways', voiceAlways ? '1' : '0'); } catch (_) {} setVoiceBtn(); add('note', voiceAlways ? 'I\'ll read every answer aloud.' : 'I\'ll only speak when you talk to me.'); };

// The living orb. Purely visual: if it can't draw, everything else still works.
let orb = { setState() {}, setAmplitude() {}, pulse() {} };
try { if (window.initOrb) orb = window.initOrb($('orb')); } catch (_) {}
const look = { recording: false, playing: false, waiting: 0, confirms: 0 };
const PHASE = { idle: 'Ready', listening: 'Listening', thinking: 'Thinking', speaking: 'Speaking', confirm: 'Waiting for your yes' };
function mood() {
  const s = look.recording ? 'listening' : look.playing ? 'speaking' : look.confirms ? 'confirm' : look.waiting ? 'thinking' : 'idle';
  try { orb.setState(s); } catch (_) {}
  $('phase').textContent = PHASE[s];
  $('phase').classList.toggle('gold', s === 'confirm');
}

function add(kind, body) {
  const el = document.createElement('div');
  el.className = 'msg ' + kind;
  el.textContent = body;
  log.appendChild(el);
  log.scrollTop = log.scrollHeight;
  return el;
}

// History survives a reload (this phone only).
const HKEY = 'hannibal-history';
function save() { try { const items = [...log.children].slice(-60).map((e) => [e.className.replace('msg ', ''), e.textContent]).filter(([k]) => !/confirm|thinking/.test(k)); localStorage.setItem(HKEY, JSON.stringify(items)); } catch (_) {} }
try { for (const [k, b] of JSON.parse(localStorage.getItem(HKEY) || '[]')) add(k, b); } catch (_) {}

// Audio: one element, unlocked on the first tap (iOS only plays after a gesture).
const audio = new Audio();
let unlocked = false;
function silentWav() {
  const n = 800, b = new ArrayBuffer(44 + n * 2), v = new DataView(b), w = (o, s) => [...s].forEach((c, i) => v.setUint8(o + i, c.charCodeAt(0)));
  w(0, 'RIFF'); v.setUint32(4, 36 + n * 2, true); w(8, 'WAVE'); w(12, 'fmt '); v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, 1, true);
  v.setUint32(24, 8000, true); v.setUint32(28, 16000, true); v.setUint16(32, 2, true); v.setUint16(34, 16, true); w(36, 'data'); v.setUint32(40, n * 2, true);
  return URL.createObjectURL(new Blob([b], { type: 'audio/wav' }));
}
// His voice on the phone: one answer at a time, each with a time limit, so one
// clip that never ends (call came in, app in the background, sound blocked)
// can't silence the ones after it. Failures go to the dropout log on the server.
let replay = null;           // a clip the phone blocked: it plays on the next tap
function unlock() {
  if (replay) {
    const u = replay; replay = null; unlocked = true;
    const end = () => { audio.onplaying = audio.onended = audio.onerror = audio.onpause = null; look.playing = false; mood(); };
    audio.onplaying = () => { look.playing = true; mood(); };
    audio.onended = audio.onerror = audio.onpause = end;
    audio.src = u; audio.play().catch(end); return;
  }
  if (unlocked) return; unlocked = true; audio.src = silentWav(); audio.play().catch(() => {});
}
document.addEventListener('pointerdown', unlock);
const device = () => ((navigator.userAgent.match(/iPhone|iPad|Android/) || ['phone'])[0]);
function reportDrop(stage, error, recovered = false) {
  fetch('/api/voice-drop', { method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ stage, error: String((error && error.message) || error).slice(0, 200), device: device(), recovered }) }).catch(() => {});
}
function playOnce(url) {
  return new Promise((resolve, reject) => {
    let started = false, finished = false, limit = null, startWatch = null;
    const done = (err) => {
      if (finished) return; finished = true;
      clearTimeout(limit); clearTimeout(startWatch);
      look.playing = false; mood();
      audio.onended = audio.onerror = audio.onplaying = audio.onloadedmetadata = audio.onpause = null;
      if (err) { try { audio.pause(); } catch (_) {} reject(err); } else resolve();
    };
    audio.onplaying = () => {
      started = true; look.playing = true; mood();
      audio.onpause = () => { if (!audio.ended) done(new Error('the sound was interrupted (a call, or the app went to the background)')); };
    };
    audio.onended = () => done();
    audio.onerror = () => done(new Error('the phone could not play the audio'));
    audio.onloadedmetadata = () => {
      const d = audio.duration;
      if (isFinite(d) && d > 0) { clearTimeout(limit); limit = setTimeout(() => done(new Error('the clip never finished')), d * 1000 + Math.max(2500, d * 250)); }
    };
    limit = setTimeout(() => done(new Error('the clip never finished')), 60000);
    startWatch = setTimeout(() => { if (!started) done(new Error('no sound started within 5 s')); }, 5000);
    audio.src = url;
    audio.play().catch((e) => done(e));
  });
}
async function speakNow(t) {
  look.waiting++; mood();                    // his voice is being made: keep thinking
  try { return await speakNow2(t); } finally { look.waiting = Math.max(0, look.waiting - 1); mood(); }
}
async function speakNow2(t) {
  let r;
  try {
    const ctl = new AbortController(); const tm = setTimeout(() => ctl.abort(), 25000);
    try { r = await fetch('/api/speak', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ text: t }), signal: ctl.signal }); }
    finally { clearTimeout(tm); }
    if (!r.ok) throw new Error(`the server could not make the voice (${r.status})`);
  } catch (e) { reportDrop('tts', e.name === 'AbortError' ? 'the voice request took longer than 25 s' : e); return; }
  const url = URL.createObjectURL(await r.blob());
  for (let attempt = 0; attempt < 2; attempt++) {
    try { await playOnce(url); if (attempt) reportDrop('play', 'first try failed, second worked', true); return; }
    catch (e) {
      if (e && e.name === 'NotAllowedError') {          // the phone wants a tap first
        unlocked = false; replay = url;
        add('note', 'Tap anywhere to hear me.');
        reportDrop('play', 'the phone blocked the sound until a tap', false);
        return;
      }
      if (attempt) { reportDrop('play', e, false); URL.revokeObjectURL(url); return; }
      try { audio.load(); } catch (_) {}
    }
  }
}
let speakChain = Promise.resolve();
function speak(t) { speakChain = speakChain.then(() => speakNow(t)).catch(() => {}); return speakChain; }

function busy(on, ask) { if (ask) { look.waiting = Math.max(0, look.waiting + (on ? 1 : -1)); mood(); } $('state').textContent = on ? 'thinking…' : (online ? 'online' : 'offline'); }

async function answer(r, spoken) {
  const j = await r.json().catch(() => ({ reply: 'No answer from the server.' }));
  return j;
}

async function say(t) {
  t = t.trim(); if (!t) return;
  add('me', t); save();
  text.value = ''; resize();
  const wait = add('him thinking', '…'); busy(true, 1);
  try {
    const j = await answer(await fetch('/api/say', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ text: t }) }));
    wait.remove(); add('him', j.reply || '…'); save();
    if (voiceAlways && j.ok) speak(j.reply);
  } catch (e) { wait.remove(); add('note', 'Could not reach Hannibal. Are you on Tailscale?'); }
  busy(false, 1);
}

// Typing
function resize() { text.style.height = 'auto'; text.style.height = Math.min(120, text.scrollHeight) + 'px'; send.hidden = !text.value.trim(); mic.hidden = !!text.value.trim(); }
text.addEventListener('input', resize);
text.addEventListener('keydown', (e) => { if (e.key === 'Enter' && !e.shiftKey && !/iPhone|Android/i.test(navigator.userAgent)) { e.preventDefault(); say(text.value); } });
send.onclick = () => say(text.value);

// Hold to talk
let rec = null, chunks = [], started = 0;
const pickType = () => ['audio/webm;codecs=opus', 'audio/mp4', 'audio/webm', 'audio/ogg'].find((t) => window.MediaRecorder && MediaRecorder.isTypeSupported(t)) || '';
async function startRec(e) {
  e.preventDefault(); unlock();
  if (!navigator.mediaDevices || !window.MediaRecorder) { add('note', 'This browser cannot record here. Use the https address, or type.'); return; }
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    const type = pickType();
    rec = new MediaRecorder(stream, type ? { mimeType: type } : undefined);
    chunks = []; started = Date.now();
    meter(stream);
    rec.ondataavailable = (ev) => { if (ev.data && ev.data.size) chunks.push(ev.data); };
    rec.onstop = async () => {
      stream.getTracks().forEach((t) => t.stop());
      meterOff();
      if (Date.now() - started < 500) { hint.textContent = 'Hold the button while you talk.'; setTimeout(() => (hint.textContent = ''), 2000); return; }
      const blob = new Blob(chunks, { type: rec.mimeType || type || 'audio/webm' });
      const wait = add('him thinking', 'Listening…'); busy(true, 1);
      try {
        const j = await answer(await fetch('/api/voice', { method: 'POST', headers: { 'Content-Type': blob.type }, body: blob }));
        wait.remove();
        if (j.heard) add('me', '🎙 ' + j.heard);
        add('him', j.reply || '…'); save();
        if (j.ok) speak(j.reply);
      } catch (_) { wait.remove(); add('note', 'Could not reach Hannibal.'); }
      busy(false, 1);
    };
    rec.start(); mic.classList.add('rec'); look.recording = true; mood(); hint.textContent = 'Listening… let go to send';
  } catch (err) { add('note', 'No microphone access: ' + (err && err.message || err)); }
}
function stopRec(e) { if (e) e.preventDefault(); if (rec && rec.state === 'recording') rec.stop(); mic.classList.remove('rec'); hint.textContent = ''; look.recording = false; mood(); }
// Mic level drives the orb while you talk (best effort; recording never depends on it).
let meterCtx = null, meterRaf = 0;
function meter(stream) {
  try {
    const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return;
    meterOff(); meterCtx = new AC(); if (meterCtx.state === 'suspended') meterCtx.resume().catch(() => {});
    const src = meterCtx.createMediaStreamSource(stream), an = meterCtx.createAnalyser(); an.fftSize = 512; src.connect(an);
    const buf = new Uint8Array(an.fftSize);
    const loop = () => { an.getByteTimeDomainData(buf); let sum = 0; for (const v of buf) sum += (v - 128) * (v - 128);
      orb.setAmplitude(Math.min(1, Math.sqrt(sum / buf.length) / 30)); meterRaf = requestAnimationFrame(loop); };
    cancelAnimationFrame(meterRaf); loop();
    meter.src = src;
  } catch (_) {}
}
// Closed after each recording so the iPhone's sound goes back to the speaker as before.
function meterOff() { cancelAnimationFrame(meterRaf); try { meter.src && meter.src.disconnect(); } catch (_) {} meter.src = null; if (meterCtx) { meterCtx.close().catch(() => {}); meterCtx = null; } orb.setAmplitude(0); }
mic.addEventListener('pointerdown', startRec);
mic.addEventListener('pointerup', stopRec);
mic.addEventListener('pointercancel', stopRec);
mic.addEventListener('pointerleave', stopRec);

// Live events: confirmations, reminders, the morning brief.
let online = false;
const cards = new Map();
function connect() {
  const es = new EventSource('/api/events');
  es.onopen = () => { online = true; $('dot').classList.add('on'); busy(false); };
  es.onerror = () => { online = false; $('dot').classList.remove('on'); $('state').textContent = 'reconnecting…'; };
  es.onmessage = (m) => {
    let ev; try { ev = JSON.parse(m.data); } catch (_) { return; }
    if (ev.type === 'hello' && ev.status && ev.status.mac != null) $('state').textContent = ev.status.mac ? 'online · Mac linked' : 'online · Mac asleep';
    if (ev.type === 'notify') { orb.pulse(60); add('notify', ev.text); save(); speak(ev.text); if (navigator.vibrate) navigator.vibrate(200); }
    if (ev.type === 'confirm') {
      const el = add('confirm', ev.summary + '\n\nShall I go ahead?');
      const row = document.createElement('div'); row.className = 'row';
      for (const [label, yes, cls] of [['Yes', true, 'yes'], ['No', false, 'no']]) {
        const b = document.createElement('button'); b.textContent = label; b.className = cls;
        b.onclick = () => { row.remove(); if (cards.delete(ev.id)) { look.confirms = cards.size; mood(); } fetch('/api/confirm', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ id: ev.id, yes }) }); };
        row.appendChild(b);
      }
      el.appendChild(row); log.scrollTop = log.scrollHeight; cards.set(ev.id, el); look.confirms = cards.size; mood(); orb.pulse(40);
      if (navigator.vibrate) navigator.vibrate([100, 60, 100]);
    }
    if (ev.type === 'confirm-closed') {
      const el = cards.get(ev.id); if (el) { const r = el.querySelector('.row'); if (r) r.remove(); cards.delete(ev.id); }
      look.confirms = cards.size; mood();
      add('note', (ev.ok ? '✓ ' : '✗ ') + ev.note);
    }
  };
}
connect();
if (!log.children.length) add('him', 'Hannibal here. Type, or hold the mic and talk.');
</script>
</body>
</html>
